<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="bento">
    <section class="card header">
      <h1>Tab Refresh</h1>
      <span id="status" class="status">Stopped</span>
    </section>

    <section class="card delay">
      <label class="hint" for="seconds">Delay</label>
      <input id="seconds" type="number" min="1" value="10">
      <span class="hint">seconds</span>
    </section>

    <button id="start" class="card start">Start</button>
    <button id="stop" class="card stop" disabled>Stop</button>

    <section id="countdown" class="card countdown" hidden>
      <div class="countdown-row">
        <span class="hint">Next refresh in</span>
        <span id="remaining" class="remaining"></span>
      </div>
      <div class="track">
        <div id="progress" class="progress"></div>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
